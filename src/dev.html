<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信号通路模拟器 · DEV 开发模式</title>
<!--
  ⚠️ 这是「开发预览」页，不要用它做最终发布。
  · 源码已迁 TypeScript（src/*.ts）。浏览器不能直接跑 .ts，所以这里加载
    tools/build.js 一样的编译产物（build/）。工作流：
      node tools/dev-server.mjs          # 起本地服务器
      ./node_modules/.bin/tsc -w         # 另开终端跑 watch，.ts 一保存即重编到 build/
    刷新浏览器即生效。
  · 想发布给别人 / 双击运行 → 用 tools/build.js 生成的 dist/信号通路模拟器.html
-->
<link rel="stylesheet" href="./styles.css">
<style>
  .dev-badge {
    position: fixed; right: 12px; bottom: 12px; z-index: 99;
    background: #854F0B; color: #fff; font: 11px/1.6 ui-monospace, monospace;
    padding: 3px 10px; border-radius: 6px; opacity: .9; pointer-events: none;
  }
</style>
</head>
<body>
<div class="dev-badge">DEV · tsc watch 编译后刷新即生效</div>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <circle cx="6" cy="16" r="3.4" fill="#4dd0c7"/>
        <circle cx="16" cy="7" r="3.4" fill="#4dd0c7"/>
        <circle cx="16" cy="25" r="3.4" fill="#ff7a6b"/>
        <circle cx="26" cy="16" r="3.4" fill="#b39dff"/>
        <path d="M6 16 L16 7 M6 16 L16 25 M16 7 L26 16 M16 25 L26 16"
              stroke="#3a5560" stroke-width="1.6" fill="none"/>
      </svg>
      <div class="brand-text">
        <h1>信号通路模拟器</h1>
        <p id="levelName">—</p>
      </div>
    </div>

    <div class="clock">
      <span class="clock-label">推演时间</span>
      <span class="clock-value" id="clock">00.0s</span>
      <span class="clock-total" id="clockTotal">/ 90s</span>
    </div>

    <div class="controls">
      <button class="btn" id="btnPause" title="空格键">暂停</button>
      <button class="btn" id="btnSpeed" title="切换推演速度">1×</button>
      <button class="btn ghost" id="btnReset" title="R 键">重置</button>
      <button class="btn ghost" id="btnHelp">说明</button>
    </div>
  </header>

  <main class="stage">
    <section class="board">
      <div class="canvas-wrap">
        <canvas id="pathway"></canvas>
        <div class="tooltip" id="tooltip"></div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-head"><span>稳态指标</span><span class="panel-tag" id="phaseTag">推演中</span></div>
        <div class="gauge-main">
          <div class="gauge-row">
            <span class="gauge-name">钙离子浓度 Ca²⁺</span>
            <span class="gauge-val" id="caVal">100</span>
          </div>
          <div class="gauge-bar">
            <div class="gauge-safe" id="caSafe"></div>
            <div class="gauge-fill" id="caFill"></div>
            <div class="gauge-target" id="caTarget"></div>
          </div>
          <div class="gauge-foot">
            <span>目标 ≤ <b id="caGoal">45</b></span>
            <span id="caHold">已稳定 0.0s / 3.0s</span>
          </div>
        </div>
        <div class="mini-grid">
          <div class="mini">
            <span class="mini-name">平滑肌舒张度</span>
            <span class="mini-val" id="relaxVal">0%</span>
            <div class="mini-bar"><div class="mini-fill" id="relaxFill" style="background:#7ee08a"></div></div>
          </div>
          <div class="mini">
            <span class="mini-name">cGMP 浓度</span>
            <span class="mini-val" id="cgmpVal">0</span>
            <div class="mini-bar"><div class="mini-fill" id="cgmpFill" style="background:#4dd0c7"></div></div>
          </div>
          <div class="mini">
            <span class="mini-name">GTP 能量池</span>
            <span class="mini-val" id="gtpVal">1200</span>
            <div class="mini-bar"><div class="mini-fill" id="gtpFill" style="background:#ffd479"></div></div>
          </div>
        </div>
      </div>

      <div class="panel dock">
        <div class="panel-head">
          <span>道具栏</span><span class="panel-tag">点击投放 · 数字键 1–4</span>
        </div>
        <div class="dock-items" id="dock"></div>
      </div>

      <div class="panel grow" id="inspectorPanel">
        <div class="panel-head"><span id="inspectorTitle">节点档案</span></div>
        <div class="inspector" id="inspector"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><span>事件流水</span></div>
        <div class="log" id="log"></div>
      </div>
    </aside>

    <section class="panel trend">
      <div class="panel-head"><span id="trendTitle">浓度动态</span><span class="panel-tag mono" id="tickTag">10 Hz</span></div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modalCard"></div>
  </div>

  <div class="modal" id="briefModal">
    <div class="modal-card brief-card" id="briefCard"></div>
  </div>

</div>
<script type="module" src="../build/main.js"></script>
</body>
</html>
