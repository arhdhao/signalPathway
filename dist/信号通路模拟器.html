<title>信号通路模拟器 · Signaling Pathway Simulator</title>
<style>:root{
  --bg:#0a0e13; --panel:#111821; --panel2:#151e29; --border:#212d3d;
  --text:#e6edf3; --muted:#8b98a5; --dim:#5c6b7a;
  --accent:#4dd0c7; --purple:#b39dff; --red:#ff7a6b;
  --amber:#ffd479; --green:#7ee08a; --blue:#8fd3ff;
  --radius:12px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px; line-height:1.55; overflow:hidden;
}
#app{height:100vh; display:flex; flex-direction:column}

/* ------------------------------------------------------------- 顶栏 */
.topbar{
  display:flex; align-items:center; gap:24px;
  padding:12px 20px; background:linear-gradient(180deg,#0f1620,#0c1219);
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.brand{display:flex; align-items:center; gap:11px; min-width:270px}
.logo{flex-shrink:0}
.brand-text h1{font-size:15px; font-weight:600; letter-spacing:.3px}
.brand-text p{font-size:11px; color:var(--muted); font-family:var(--mono)}
.clock{display:flex; align-items:baseline; gap:7px; margin-left:auto}
.clock-label{font-size:11px; color:var(--muted)}
.clock-value{font-family:var(--mono); font-size:22px; font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums}
.clock-total{font-family:var(--mono); font-size:12px; color:var(--dim)}
.controls{display:flex; gap:8px}
.btn{
  background:var(--panel2); color:var(--text); border:1px solid var(--border);
  padding:7px 15px; border-radius:8px; cursor:pointer; font-size:12.5px;
  font-family:inherit; transition:.15s;
}
.btn:hover{background:#1d2836; border-color:#33465c}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn.on{border-color:var(--accent); color:var(--accent)}

/* ------------------------------------------------------------- 主区 */
.stage{flex:1; display:grid; grid-template-columns:1fr 372px; gap:14px; padding:14px; min-height:0}
.board{display:flex; flex-direction:column; gap:12px; min-height:0; min-width:0}
.canvas-wrap{
  flex:1; position:relative; background:radial-gradient(ellipse at 50% 35%,#101a24 0%,#0a0e13 70%);
  border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; min-height:0;
}
#pathway{display:block; cursor:pointer}

.tooltip{
  position:absolute; pointer-events:none; opacity:0; transition:opacity .12s;
  background:rgba(10,16,22,.96); border:1px solid #2c3d50; border-radius:9px;
  padding:9px 12px; max-width:280px; font-size:12px; line-height:1.6; z-index:20;
  box-shadow:0 8px 26px rgba(0,0,0,.5);
}
.tooltip.show{opacity:1}
.tooltip b{color:var(--accent)}
.tooltip .tt-desc{color:var(--muted); font-size:11.5px; margin-top:5px}
.tooltip .tt-tags{margin-top:6px; display:flex; flex-wrap:wrap; gap:4px}
.tooltip .tag{font-family:var(--mono); font-size:9.5px; padding:1.5px 5px; border-radius:4px;
  background:rgba(77,208,199,.12); color:var(--accent); border:1px solid rgba(77,208,199,.25)}

/* ------------------------------------------------------------- 道具栏 */
.dock{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:11px 13px; flex-shrink:0}
.dock-head{display:flex; align-items:baseline; gap:10px; margin-bottom:9px}
.dock-title{font-size:12.5px; font-weight:600}
.dock-hint{font-size:10.5px; color:var(--dim)}
.dock-items{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:9px}
.drug{
  display:flex; gap:10px; align-items:flex-start; text-align:left;
  background:var(--panel2); border:1px solid var(--border); border-radius:10px;
  padding:9px 11px; cursor:pointer; transition:.15s; position:relative; overflow:hidden;
}
.drug:hover:not(:disabled){border-color:#3a5570; transform:translateY(-1px)}
.drug:disabled{opacity:.32; cursor:not-allowed}
.drug .dicon{width:26px;height:26px;flex-shrink:0;border-radius:7px;display:grid;place-items:center}
.drug .dname{font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px}
.drug .den{font-family:var(--mono); font-size:9.5px; color:var(--dim)}
.drug .ddesc{font-size:10.5px; color:var(--muted); margin-top:3px; line-height:1.5}
.drug .dkey{
  position:absolute; top:7px; right:8px; font-family:var(--mono); font-size:9.5px;
  color:var(--dim); border:1px solid var(--border); border-radius:4px; padding:0 4px;
}
.drug .dcount{
  position:absolute; bottom:7px; right:9px; font-family:var(--mono);
  font-size:10px; color:var(--muted);
}

/* ------------------------------------------------------------- 侧栏 */
.sidebar{display:flex; flex-direction:column; gap:11px; min-height:0; overflow:hidden}
.panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:11px 13px; flex-shrink:0}
.panel.grow{flex:1; min-height:120px; display:flex; flex-direction:column}
.panel-head{
  display:flex; justify-content:space-between; align-items:center;
  font-size:12px; font-weight:600; margin-bottom:9px; color:#c8d6e2;
}
.panel-tag{font-size:10px; color:var(--dim); font-weight:400; font-family:var(--mono)}
.panel-tag.warn{color:var(--red)}
.panel-tag.good{color:var(--green)}

/* 仪表 */
.gauge-main{margin-bottom:12px}
.gauge-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px}
.gauge-name{font-size:11.5px; color:var(--muted)}
.gauge-val{font-family:var(--mono); font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--red)}
.gauge-val.good{color:var(--green)}
.gauge-bar{position:relative; height:9px; background:#0c141d; border-radius:5px; overflow:hidden; border:1px solid #1b2634}
.gauge-safe{position:absolute; left:0; top:0; bottom:0; background:rgba(126,224,138,.16)}
.gauge-fill{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#ff9d8f,#ff7a6b); transition:width .12s linear}
.gauge-fill.good{background:linear-gradient(90deg,#9beaa8,#7ee08a)}
.gauge-target{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--green); opacity:.85}
.gauge-foot{display:flex; justify-content:space-between; font-size:10.5px; color:var(--dim); margin-top:5px}
.gauge-foot b{color:var(--green)}

.mini-grid{display:flex; flex-direction:column; gap:8px}
.mini{display:grid; grid-template-columns:1fr auto; gap:2px 8px; align-items:baseline}
.mini-name{font-size:11px; color:var(--muted)}
.mini-val{font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums}
.mini-bar{grid-column:1/-1; height:4px; background:#0c141d; border-radius:3px; overflow:hidden}
.mini-fill{height:100%; width:0; transition:width .12s linear; opacity:.85}

.chart-wrap{height:124px}
#chart{display:block}

/* 检查器 */
.inspector{flex:1; overflow-y:auto; font-size:12px; padding-right:3px}
.insp-desc{color:var(--muted); line-height:1.7; margin-bottom:11px; font-size:11.5px}
.insp-tags{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:11px}
.insp-stats{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px}
.insp-stat{background:#0d151e; border:1px solid #1a2532; border-radius:7px; padding:6px 8px}
.insp-stat .k{font-size:9.5px; color:var(--dim); font-family:var(--mono)}
.insp-stat .v{font-size:13px; font-family:var(--mono); font-variant-numeric:tabular-nums}
.param{margin-bottom:11px}
.param-row{display:flex; justify-content:space-between; font-size:11px; margin-bottom:3px}
.param-row .pk{color:var(--muted)}
.param-row .pv{font-family:var(--mono); color:var(--accent)}
.param input[type=range]{width:100%; accent-color:var(--accent); height:4px}
.param-note{font-size:10px; color:var(--dim); margin-top:3px}
.lesson{background:#0d151e; border-left:2px solid var(--purple); border-radius:0 7px 7px 0;
  padding:7px 10px; margin-bottom:7px; font-size:11px; color:#b8c8d6; line-height:1.65}
.hint-box{background:rgba(77,208,199,.06); border:1px solid rgba(77,208,199,.18);
  border-radius:8px; padding:9px 11px; font-size:11.5px; color:#a8c4c0; line-height:1.7; margin-bottom:11px}

/* 日志 */
.log{height:104px; overflow-y:auto; font-family:var(--mono); font-size:10.5px; line-height:1.85}
.log-item{display:flex; gap:7px; color:var(--muted); padding:1px 0}
.log-item .lt{color:var(--dim); flex-shrink:0}
.log-item.k-drug{color:var(--purple)}
.log-item.k-win{color:var(--green)}
.log-item.k-lose{color:var(--red)}
.log-item.k-param{color:var(--amber)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#253141;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#33465c}

/* ------------------------------------------------------------- 弹窗 */
.modal{
  position:fixed; inset:0; background:rgba(5,8,12,.82); backdrop-filter:blur(4px);
  display:grid; place-items:center; z-index:100; padding:20px;
}
.modal[hidden]{display:none}
.modal-card{
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:26px 30px; max-width:520px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.modal-card h2{font-size:19px; margin-bottom:6px; display:flex; align-items:center; gap:9px}
.modal-card h2 .badge{font-size:11px; padding:3px 9px; border-radius:20px; font-weight:500}
.badge.win{background:rgba(126,224,138,.15); color:var(--green); border:1px solid rgba(126,224,138,.3)}
.badge.lose{background:rgba(255,122,107,.15); color:var(--red); border:1px solid rgba(255,122,107,.3)}
.modal-card .m-desc{color:var(--muted); line-height:1.8; margin:12px 0 16px; font-size:12.5px}
.modal-card .m-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:18px}
.m-stat{background:#0d151e; border:1px solid #1a2532; border-radius:9px; padding:9px 11px}
.m-stat .k{font-size:10px; color:var(--dim); font-family:var(--mono)}
.m-stat .v{font-size:16px; font-family:var(--mono); font-weight:600}
.modal-card .m-actions{display:flex; gap:9px; justify-content:flex-end}
.btn.primary{background:var(--accent); color:#06231f; border-color:var(--accent); font-weight:600}
.btn.primary:hover{background:#5fe0d7}
.brief-card{max-width:640px}
.brief-card h2{font-size:18px}
.brief-card p{color:var(--muted); line-height:1.85; margin:10px 0; font-size:12.5px}
.brief-card ul{margin:8px 0 0 18px; color:var(--muted); font-size:12.5px; line-height:1.9}
.brief-card .kbd{font-family:var(--mono); font-size:11px; background:#0d151e;
  border:1px solid var(--border); border-radius:4px; padding:1px 5px; color:var(--text)}

@media (max-width:1180px){
  .stage{grid-template-columns:1fr 320px}
  .topbar{gap:14px}
  .brand-text h1{font-size:14px}
}
</style>

/* ============================================================================

 * 结算四步：  匹配标签(tags) → 掷骰子(band) → 挂 Buff(activation/timer) → 乘数增量(amplify)

 * ==========================================================================*/

/* 【如何读这个文件 —— 给非程序员的导读】
 * 整个引擎本质上是一个「状态机」：每 100 毫秒走一步，把所有节点的激活度、
 * 分子数量、Buff 倒计时推进一步。这文件从下到上分六块：
 *
 *   ① TUNING            —— 引擎机制常量：Buff 衰减倍率、抖动幅度、各种上限

 *   ③ MoleculeTemplate  —— 节点的"出厂设定"：标签、命中频段、放大倍数等
 *   ④ Molecule          —— 节点的运行时实例：当前激活度、Buff 剩余时间等

 *
 * 【本文件最重要的原则：引擎不认识任何具体的分子名】
 * 这个文件里不该出现 'NO' / 'cGMP' / 'GTP' / 'Ca' 这类关卡专属的名字，
 * 也不该出现「cGMP 超过 190 判负」这种关卡规则。它们全都在

 *       会   → 它是关卡内容，放进 pathways/*.js

 * 引擎只提供四种"判定形状"（指标怎么算 / 怎么算赢 / 怎么算三种死法 / 曲线采什么），
 * 具体判谁、判多少、说什么话，一律由关卡填表。
 * 好处：做第二关时复制关卡文件改数据即可，引擎一行都不用动。
 *
 * 关键概念：
 *   · "标签密码"  决定两个分子能不能碰撞。每个分子挂几个标签 (tags)，
 *                 只有共享至少一个标签的分子对才会发生反应。这是 PDF 设计的核心。
 *   · "四步结算"  每个 tick 对每条反应边执行：匹配标签 → 掷骰子 → 挂 Buff → 乘数增量。
 *   · "槽位竞争"  降解酶的处理能力按数量瓜分给所有可降解底物。不可降解的诱饵靠
 *                 "占座不退出"把真正的底物保护下来 —— 这就是竞争性抑制在代码里的表达。
 *   · "双缓冲"    Simulator.tick() 里所有反应"读 this 快照、写 next 缓冲"，末尾一次性提交。
 *                 保证信号传播严格 1 tick 延迟，消除遍历顺序带来的"幽灵先手"——
 *                 反馈回路密集的通路尤其依赖它（见 gifts/ 里 Gemini 评审第二条）。
 *   · "三种失败"  能量枯竭 / 脱靶毒性 / 无响应超时，加上"成功"共四种结局。
 *                 判定配方在关卡的 OUTCOME 里，判定引擎在 _judge() 里。
 *
 * 如果你只想读懂一个函数，从 Simulator.tick() 开始；它就是每 100ms 发生一次的"心跳"。
 */

const TICK_MS = 100;
const TPS = 1000 / TICK_MS; // 每秒逻辑帧数 = 10

/* ==========================================================================
 * TUNING —— 引擎机制常量
 * --------------------------------------------------------------------------
 * 【这一块和关卡数据有什么区别？判断标准只有一条】
 *
 *   换一个关卡（比如做一条全新的通路），这个数字会不会跟着变？
 *     · 会  → 它是关卡内容，应该放进 src/pathways/*.js
 *     · 不会 → 它是引擎机制，属于这里
 *
 * 举例：「Buff 期内衰减放慢到 35%」是引擎的通用规则，第二关、第三关也一样，
 * 所以它在这里；而「cGMP 超过 190 判负」「GTP 池见底算饿死」是第一关的
 * 关卡设计，所以它们在 nocgmp.js 的 OUTCOME 里。
 *
 * 这里的数字以前是直接写在代码里的裸数字（所谓魔法数字），现在提上来并命名：
 * 好处是调引擎手感时只改这一处，而且看名字就知道它在管什么。
 * ⚠️ 改动这些值会影响【所有关卡】，改完要跑 tools/balance.mjs 与 tools/smoke.mjs。
 * ==========================================================================*/
const TUNING = {
  /** 激活度的满值。激活度是一个 0–100 的抽象刻度，不是真实浓度 —— 别当物理单位看。 */
  activationMax: 100,

  /** Buff 生效期内，激活度衰减放慢到的倍率（模拟"被化学修饰后状态更稳定"）。 */
  buffDecayScale: 0.35,
  /** Buff 过期后，激活度衰减加速到的倍率（模拟"修饰被移除，迅速回落"）。 */
  spentDecayScale: 2.0,

  /** 被沉默（抑制）时，激活度每 tick 乘以的系数 —— 越接近 1 崩塌越慢。 */
  muteCollapse: 0.90,
  /** 激活度 ≥ 此值，节点对外显示为「激活中」（决定发光强度）。 */
  activeThreshold: 55,

  /** 每次命中 / 产出的随机抖动区间，让模拟不至于像一条死板的曲线。 */
  hitJitter: [0.85, 1.15],

  /** 脉冲周期的下限（tick）。防止关卡把 period 配得过小导致每 tick 都喷发。 */
  pulsePeriodFloor: 3,

  /** 同类增益型药物【连续投放】时，放大倍数的累乘增量（不是覆盖，是叠加 ——
   *  这正是"叠加用药出事"的机制来源，见 applyDrug 的 boostPulse 分支）。 */
  boostStackBonus: 0.7,

  /** 命中闪光每 tick 的衰减量，纯视觉。 */
  flashFade: 0.12,

  /** 折线图最多保留多少帧快照（超出后丢弃最旧的）。 */
  historyCap: 1200,
  /** 每 N 个 tick 存一条折线图快照。 */
  snapshotEvery: 2,
  /** 事件流水最多保留多少条。 */
  eventCap: 60,
};

/**
 * 极简模板填充：把字符串里的 {name} 换成 vars 里对应的值。
 * 找不到对应值就原样保留 {name}，方便一眼看出漏传了什么。
 *
 * 为什么需要它：结算文案里有「cGMP 突破 190 红线」这种带运行时数字、
 * 又提到关卡分子名的句子。文案属于关卡（COPY），数字属于运行时，
 * 用占位符把两边接起来，引擎就不用再拼字符串、也不用认识 cGMP 是什么了。
 */
function fillTemplate(tpl, vars) {
  return String(tpl).replace(/\{\s*(\w+)\s*\}/g, (all, key) =>
    key in vars ? String(vars[key]) : all
  );
}

/** 夹在 [lo, hi] 之间的小工具，_updateMetrics 里约束指标上下限用 */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ---------------------------------------------------------------- 随机数 */
/** mulberry32：可复现的伪随机源，便于关卡回放与参数敏感性分析 */
class RNG {
  constructor(seed = 20260904) {
    this.seed = seed >>> 0 || 1;
    this.s = this.seed;
  }
  next() {
    this.s = (this.s + 0x6d2b79f5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + this.next() * (b - a); }
  /** 掷一枚 0–100 的骰子 */
  roll() { return this.next() * 100; }
  reseed(seed) { this.seed = seed >>> 0 || 1; this.s = this.seed; }
}

/* ---------------------------------------------------------------- 状态枚举 */
const Status = {
  INACTIVE: 'Inactive', // 未激活 / 休眠
  ACTIVE: 'Active',     // 激活（挂载增益 Buff）
  MUTED: 'Muted',       // 沉默 / 被抑制
};

/* ------------------------------------------------------- Molecule 模板 */
/**
 * 所有信号分子 / 药物的抽象模板。运行时实例由 Simulator 从此模板生成。
 * 关键字段（与 PDF 设计一一对应）：
 *   tags      —— 三维结构密码，只有标签相交才允许碰撞
 *   band      —— 命中频段 [lo, hi]，骰子落在此区间才算命中
 *   K         —— 半饱和常数：多少个上游分子能把推动力推到 50%
 *   hill      —— 协同系数，>1 表示需要多个分子协同才能激活（S 形响应）
 *   amplify   —— 放大乘数，激活后每 tick 批量产出下游分子的基数
 *   decay     —— 激活度每 tick 的衰减比例
 *   buffTicks —— 一次命中后增益 Buff 持续的 tick 数
 */
class MoleculeTemplate {
  constructor(cfg) {
    Object.assign(this, {
      id: 'mol',
      name: 'Molecule',
      cn: '',
      kind: 'node',          // node | drug
      role: 'generic',       // source|messenger|receptor|amplifier|kinase|effector|decoy|donor
      tags: [],
      x: 0, y: 0,            // 拓扑图坐标
      band: [0, 30],         // 命中频段
      K: 100,                // 半饱和常数
      hill: 1,               // 协同系数
      amplify: 1,            // 放大乘数
      decay: 0.05,           // 激活度衰减
      baseDecay: 0,          // 物质自然降解（信使分子）
      buffTicks: 25,         // Buff 持续 tick
      drive: 'activation',   // activation | count | pulse
      degradable: true,      // 是否可被降解酶清除（西地那非 = false）
      editable: [],          // 允许玩家在侧边栏调节的参数白名单
      desc: '',
      color: '#4dd0c7',
    }, cfg);
  }
}

/* ------------------------------------------------------- Molecule 实例 */
class Molecule {
  constructor(tpl) {
    this.tpl = tpl;
    this.id = tpl.id;
    this.count = 0;           // 分子数量（信使 / 药物）
    this.activation = 0;      // 激活度 0–100（酶 / 受体）
    // 双缓冲：本 tick 反应写入的"下一帧"状态。tick() 开头从当前快照拷入，
    // 所有反应只读 this.*（快照）、只写 next.*（缓冲），末尾一次性提交。
    // 这是消除"遍历顺序幽灵先手"的关键，也让反馈回路获得严格的 1 tick 传播延迟。
    this.nextCount = 0;
    this.nextActivation = 0;
    this.status = Status.INACTIVE;
    this.timer = 0;           // Buff 倒计时
    this.muteTimer = 0;       // 沉默倒计时
    this.buffs = [];          // { id, name, kind, timer, source }
    this.flash = 0;           // 命中闪光，渲染层读取
    this.lastGain = 0;        // 本 tick 产量，粒子系统读取
    this.lastHit = false;     // 本 tick 是否掷骰命中
    this.metabolism = 0;      // 药物代谢清除速率
  }

  get isDrug() { return this.tpl.kind === 'drug'; }
  get isMuted() { return this.muteTimer > 0; }

  /** 对下游的推动力 0–1 —— 相当于连续模型里的「有效浓度」
   *
   * 关键设计：用「饱和曲线」替代米氏方程。
   *   drive = count / (count + K)         // 标准饱和（count 驱动）
   *   drive = activation / 100            // 酶激活度直接当推动力（activation 驱动）
   * 数学含义：分子越多 → 推动力越大，但越接近上限越难继续涨。
   * 这就是「信号传导有天花板」的代码表达 —— 没有这个上限，任意放大器都会失控。
   */
  get drive() {
    if (this.isMuted) return 0;
    const t = this.tpl;
    if (t.drive === 'count') return this.count / (this.count + t.K);
    if (t.drive === 'pulse') return this.count > 1 ? 1 : this.count;
    return this.activation / TUNING.activationMax;
  }

  /** 状态饱和度 0–1，供渲染层决定发光强度 */
  get saturation() {
    const t = this.tpl;
    if (t.drive === 'count' || t.drive === 'pulse') {
      return Math.min(1, this.count / (t.K * 2));
    }
    return this.activation / TUNING.activationMax;
  }

  /** 挂 Buff —— 第三步：化学修饰 → 带倒计时的状态标签
   *  双缓冲：写入 nextActivation（不是 this.activation）。增益的"天花板"仍用
   *  当前快照 this.activation 计算 room，保证同一 tick 内的多次激活不会自我叠加放大。 */
  applyActivation(delta, ticks) {
    if (this.isMuted) return 0;
    const before = this.nextActivation;
    // 饱和趋近：越接近满值越难继续上升，避免无限堆叠
    const room = 1 - this.activation / TUNING.activationMax;
    const gain = delta * Math.max(0, room);
    this.nextActivation = clamp(
      this.nextActivation + gain, 0, TUNING.activationMax
    );
    if (gain > 0 && ticks > 0) this.timer = Math.max(this.timer, ticks);
    return this.nextActivation - before;
  }

  addBuff(buff) {
    const exist = this.buffs.find((b) => b.id === buff.id);
    if (exist) { exist.timer = Math.max(exist.timer, buff.timer); return exist; }
    this.buffs.push({ ...buff });
    return buff;
  }

  mute(ticks, source = '') {
    this.muteTimer = Math.max(this.muteTimer, ticks);
    this.status = Status.MUTED;
    this.addBuff({ id: 'muted', name: '沉默', kind: 'mute', timer: ticks, source });
  }

  /** 每个逻辑帧调用 —— 消耗资源、倒计时递减 */
  onTick() {
    if (this.muteTimer > 0) {
      this.muteTimer -= 1;
      this.activation *= TUNING.muteCollapse; // 沉默期激活度快速崩塌
      if (this.muteTimer === 0) this.status = Status.INACTIVE;
    }
    this.timer = Math.max(0, this.timer - 1);
    this.buffs = this.buffs.filter((b) => (b.timer -= 1) > 0);

    // Buff 期内衰减慢，Buff 过期后加速回落 —— 这就是「激活状态有持续时间」
    const d = this.tpl.decay
      * (this.timer > 0 ? TUNING.buffDecayScale : TUNING.spentDecayScale);
    this.activation = Math.max(0, this.activation * (1 - d));

    if (this.tpl.baseDecay > 0) {
      this.count = Math.max(0, this.count * (1 - this.tpl.baseDecay));
    }
    if (this.metabolism > 0) {
      this.count = Math.max(0, this.count * (1 - this.metabolism));
    }
    this.flash = Math.max(0, this.flash - TUNING.flashFade);

    if (!this.isMuted) {
      this.status = this.activation >= TUNING.activeThreshold
        ? Status.ACTIVE : Status.INACTIVE;
    }
  }
}

/* ------------------------------------------------------------- Reaction */
/**
 * 一条反应边。effect 类型：
 *   activate —— 掷骰命中后给目标挂激活 Buff
 *   inhibit  —— 掷骰命中后给目标挂沉默 Buff
 *   produce  —— 掷骰命中后按放大乘数批量生成分子（消耗 GTP）
 *   consume  —— 槽位竞争降解：按数量比例瓜分酶的处理槽位
 */
class Reaction {
  constructor(cfg) {
    Object.assign(this, {
      id: '', from: '', to: '',
      effect: 'activate',
      band: [0, 30],
      hill: 1,
      power: 20,       // activate/inhibit 的力度
      amplify: 0,      // produce 的放大乘数
      gtpCost: 0,      // 每次产出消耗的 GTP
      slots: 0,        // consume：酶的处理槽位
      slotTag: '',     // consume：识别底物的标签
      costPool: 'GTP', // produce：这次合成消耗哪个资源池（第二关要换 ATP 就配这里）
      negate: false,   // 渲染用：是否画成抑制箭头
      label: '',
      waypoints: [],   // 渲染用：折线拐点
    }, cfg);
    if (!this.id) this.id = `${this.from}->${this.to}`;
  }
}

/* ------------------------------------------------------------ Simulator */
class Simulator {
  constructor(level, opts = {}) {
    this.level = level;
    this.rng = new RNG(opts.seed ?? 20260904);
    this.reset();
  }

  reset(seed) {
    const L = this.level;
    if (seed !== undefined) this.rng.reseed(seed);

    this.tickCount = 0;
    this.time = 0;                 // 秒
    this.nodes = new Map();
    this.reactions = L.reactions.map((r) => new Reaction(r));
    this.pools = { ...L.pools };
    this.poolsMax = { ...L.pools };
    this.metrics = {};
    for (const m of L.metrics) this.metrics[m.id] = m.base;

    for (const tpl of L.nodes) {
      const m = new Molecule(new MoleculeTemplate(tpl));
      m.count = tpl.initialCount ?? 0;
      m.activation = tpl.initialActivation ?? 0;
      this.nodes.set(m.id, m);
    }

    this.drugState = new Map(); // drugId -> { uses, active:boolean }
    for (const d of L.drugs) this.drugState.set(d.id, { uses: 0, active: false });

    this.holdTicks = 0;
    this.dangerTicks = 0;
    this.starveTicks = 0;
    this.outcome = null;        // null | {result:'win'|'lose', reason, title, detail}
    this.history = [];          // 折线图数据
    this.events = [];           // 事件流水
    this.selected = null;
    this.paused = false;
    this.speed = 1;
    this._pulseClock = 0;
    this._ntgBoost = 0;
    this._ntgFactor = 1;
    this._ntgPeriod = 1;
  }

  get nodeList() { return [...this.nodes.values()]; }
  node(id) { return this.nodes.get(id); }

  log(text, kind = 'info') {
    this.events.unshift({ t: this.time.toFixed(1), text, kind });
    if (this.events.length > TUNING.eventCap) this.events.pop();
  }

  /* ---------------------------------------------------------- 投放药物 */
  applyDrug(drugId) {
    const drug = this.level.drugs.find((d) => d.id === drugId);
    if (!drug) return false;
    const st = this.drugState.get(drugId);
    if (!st || st.uses >= drug.charges) return false;

    st.uses += 1;
    st.active = true;

    for (const eff of drug.effects) {
      if (eff.kind === 'spawn') {
        // 底物 / 竞争性类似物：直接投放分子实体进入战场
        const m = this.node(eff.target);
        m.count += eff.amount;
        m.metabolism = eff.metabolism ?? 0;
      } else if (eff.kind === 'mute') {
        const m = this.node(eff.target);
        m.mute(eff.ticks, drug.name);
      } else if (eff.kind === 'boostPulse') {
        // 连续给药会累乘放大，而不是简单覆盖 —— 这正是「叠加用药出事」的机制来源
        this._ntgFactor = this._ntgBoost > 0
          ? this._ntgFactor + TUNING.boostStackBonus
          : (eff.factor ?? 2);
        this._ntgPeriod = Math.min(
          this._ntgBoost > 0 ? this._ntgPeriod : 1,
          eff.periodScale ?? 1
        );
        this._ntgBoost = Math.max(this._ntgBoost, eff.ticks);
      } else if (eff.kind === 'restore') {
        this.pools[eff.pool] = Math.min(
          this.poolsMax[eff.pool],
          this.pools[eff.pool] + eff.amount
        );
      }
    }
    this.log(`投放 ${drug.name} ×${st.uses}`, 'drug');
    return true;
  }

  /* ------------------------------------------------------------ 主循环 */
  /** 整个引擎的「心跳」 —— 每 100 毫秒被主循环调一次。
   * 一个 tick 内的严格顺序（双缓冲贯穿其中）：
   *   快照 → 脉冲(写 next) → 四步结算(读 this / 写 next) → 提交(next→this)
   *        → 自身衰减 → 资源再生 → 宏观指标 → 判定
   * 这是整局游戏唯一的"时钟源"。所有粒子动画都是这个 tick 的视觉延伸。
   */
  tick() {
    if (this.outcome || this.paused) return;
    const L = this.level;

    // —— 双缓冲：把当前状态快照到 next 缓冲区 ——
    // 之后所有反应都是"读 this（本 tick 开始的快照）、写 next（下一帧）"，
    // 这样无论 reactions 数组怎么排序、通路里有没有反馈环，信号传播都严格 1 tick 延迟，
    // 不再有"遍历顺序导致的幽灵先手"（详见 gifts/ 里 Gemini 评审的第二条）。
    for (const m of this.nodes.values()) {
      m.nextActivation = m.activation;
      m.nextCount = m.count;
    }

    /* --- 阶段 0：外部信号源脉冲释放（写入 next） --- */
    this._pulseClock += 1;
    const pulsePeriod = Math.max(
      TUNING.pulsePeriodFloor,
      Math.round(L.pulse.period * (this._ntgBoost > 0 ? this._ntgPeriod : 1))
    );
    if (this._pulseClock >= pulsePeriod) {
      this._pulseClock = 0;
      const src = this.node(L.pulse.node);
      if (src && !src.isMuted) {
        const boost = this._ntgBoost > 0 ? this._ntgFactor : 1;
        const [jLo, jHi] = TUNING.hitJitter;
        const jitter = this.rng.range(jLo, jHi);
        // 读取快照 src.count、写入缓冲 src.nextCount
        src.nextCount = Math.min(L.pulse.cap, src.count + L.pulse.amount * boost * jitter);
        src.flash = 1;
        src.lastHit = true;
      }
    }
    if (this._ntgBoost > 0) this._ntgBoost -= 1;

    /* --- 阶段 1–3：四步结算（读 this 快照、写 next 缓冲） --- */
    for (const rx of this.reactions) {
      if (rx.effect === 'consume') { this._resolveConsume(rx); continue; }
      this._resolveReaction(rx);
    }

    // —— 提交双缓冲：next → this，原子切换，下游读取到的永远是本 tick 的终态 ——
    for (const m of this.nodes.values()) {
      m.activation = m.nextActivation;
      m.count = m.nextCount;
    }

    for (const m of this.nodes.values()) m.onTick();

    for (const [k, v] of Object.entries(L.poolsRegen || {})) {
      this.pools[k] = Math.min(this.poolsMax[k], this.pools[k] + v);

    this._updateMetrics();

    this._judge();

  /* ------------------------------------------------- 单条反应：四步结算 */
  /** 这是引擎的「心法」 —— 把米氏动力学微分方程降维成桌游规则。
   *
   * 步骤对应 PDF 设计的四步：
   *   ① 锁定目标  —— 比对密码标签 (tags)，不相交则根本不发生碰撞（除非产物反应）
   *   ② 命中判定  —— 掷一个 0–100 的骰子，落进 [lo, lo + 宽度 × 推动力^hill] 就算

   *                 —— 不要被直觉骗去改 power，改了会把曲线压扁成开关

   *                 inhibit 给目标加沉默；degrade 走 _resolveConsume 槽位竞争
   *   ④ 乘数增量  —— produce 按 amplify 批量产出下游分子，并消耗 GTP
   */
  _resolveReaction(rx) {
    const from = this.node(rx.from);
    const to = this.node(rx.to);
    if (!from || !to) return;

    // 第一步 [锁定目标]：比对密码标签，不相交则根本不发生碰撞
    const matched = from.tpl.tags.some((t) => to.tpl.tags.includes(t))
      || (rx.effect === 'produce' && true); // 产物由模板自身标签决定
    if (!matched && rx.from !== to.id) { from.lastHit = false; return; }

    const drive = from.drive;
    if (drive <= 0.0001) { from.lastHit = false; return; }

    // 第二步 [命中判定]：微分方程 → 离散概率。骰子必须落进 [lo, lo + 宽度×推动力]
    const lo = rx.band[0];
    const width = rx.band[1] - rx.band[0];
    const chance = width * Math.pow(drive, rx.hill);
    const roll = this.rng.roll();
    const hit = roll >= lo && roll < lo + chance;

    from.lastHit = hit;
    if (!hit) return;

    const intensity = Math.pow(drive, rx.hill);

    // 第三步 [挂 Buff] / 第四步 [乘数增量]
    if (rx.effect === 'activate') {
      to.applyActivation(rx.power * intensity, to.tpl.buffTicks);
      to.flash = 1;
    } else if (rx.effect === 'inhibit') {
      to.mute(Math.round(rx.power * intensity), rx.label || from.tpl.name);
      to.flash = 1;
    } else if (rx.effect === 'produce') {
      // 全局能量限制：资源池见底时合成停滞（死法 A 的物理基础）。
      // 消耗哪个池由反应自己声明（rx.costPool），引擎不认识「GTP」这个名字 ——
      // 第二关想让合成消耗 ATP，在关卡里配 costPool: 'ATP' 即可，引擎不用改。
      const poolName = rx.costPool || 'GTP';
      const budget = this.pools[poolName] ?? 0;
      const supply = budget > 0 ? 1 : 0;
      const [jLo, jHi] = TUNING.hitJitter;
      let made = rx.amplify * intensity * supply * this.rng.range(jLo, jHi);
      // 能量硬约束（Gemini 评审第三条·1）：产量不能超过当前资源池能负担的量，

      // 能量枯竭会表现为产量平滑衰减，而不是断崖后凭空续命。
      if (rx.gtpCost > 0) made = Math.min(made, budget / rx.gtpCost);
      to.nextCount += made;
      to.lastGain = made;
      to.flash = 1;
      this.pools[poolName] = Math.max(0, budget - made * rx.gtpCost);

  /**

   * 所有带 `slotTag` 标签的分子按数量比例瓜分这个能力。

   * 关键：不可降解的诱饵（如西地那非）照样占座，但不被清除。

      (m) => m.tpl.tags.includes(rx.slotTag) && m.count > 0.01
    );

    const total = subs.reduce((s, m) => s + m.count, 0);
    if (total <= 0) return;

    for (const m of subs) {
      const share = (cap * m.count) / total;           // m.count 取快照，读-改分离
      if (!m.tpl.degradable) { processed += share; continue; } // 占座但不被降解
      const removed = Math.min(m.count, share);
      m.nextCount -= removed;                          // 写入下一帧缓冲

   *            典型：Ca 浓度 —— 效应器（MLCP）越活，被抽走得越多
   *            需要：driver / base / drain / restore / min / max
   *
   *   mirror   直接镜像某个分子的数量（默认 kind，不写就是它）
   *            典型：cGMP 浓度 —— 指标值就是 cGMP 分子的个数
   *            需要：driver
   *
   *   derived  由另一个指标换算而来
   *            典型：舒张度 = 100 - Ca
   *            需要：from / transform(值) / min / max
   *

  _updateMetrics() {
    for (const m of this.level.metrics) {
      const src = m.driver ? this.node(m.driver) : null;

      if (m.kind === 'driven') {
        const eff = src ? src.activation / TUNING.activationMax : 0;
        const cur = this.metrics[m.id];
        const next = cur + (m.base - cur) * m.restore - eff * m.drain;
        this.metrics[m.id] = clamp(next, m.min ?? 0, m.max ?? Infinity);
      } else if (m.kind === 'derived') {
        const v = this.metrics[m.from] ?? 0;
        this.metrics[m.id] = clamp(m.transform(v), m.min ?? 0, m.max ?? 100);
      } else {

      }

  /** 关卡配置里到处都要"取某个分子/指标/资源池的当前数值"，
   *  统一走这里，省得每个判定分支各写一套。
   *    { kind: 'node',   id: 'cGMP', prop: 'count' | 'activation' }
   *    { kind: 'metric', id: 'Ca' }
   *    { kind: 'pool',   id: 'GTP' }
   */
  _readValue(ref) {
    if (ref.kind === 'pool') return this.pools[ref.id] ?? 0;
    if (ref.kind === 'metric') return this.metrics[ref.id] ?? 0;
    const n = this.node(ref.id);
    if (!n) return 0;
    return ref.prop === 'activation' ? n.activation : n.count;
  }

  /** 指标 id → 显示名，用于往结算文案里填「钙离子浓度」这样的中文名 */
  _metricName(id) {
    return this.level.metrics.find((m) => m.id === id)?.name ?? id;
  }

  /* --------------------------------------------------------- 胜负判定 */
  /** 每个 tick 调一次。四个结局按顺序检查，命中即停。
   *
   *   ① 稳态恢复（win）  核心指标降到 below 以下并持续 hold 个 tick
   *   ② 能量枯竭         资源池见底并持续 starve.sustainTicks
   *   ③ 脱靶毒性         某分子越过红线并持续 toxicity.sustainTicks

   *
   * 【关键改动：这套配方现在整份来自关卡的 OUTCOME 配置】
   * 以前这里写死了「Ca」「cGMP」「GTP」「190」「20」「40」「0.5」「0.1」，还硬编码了
   * 四段带分子名的中文结算文案。结果就是：做第二关必须回来改引擎，而且极易漏改。
   * 现在引擎只认四种"判定形状"，具体判谁、判多少、持续多久、说什么话，全在关卡文件里。
   *

     *   本关是「cGMP 未越红线」且「GTP 高于池容 10%」。

          metric: this._metricName(win.metric),
          value: value.toFixed(1),
        });
      }
    } else {
      // 没达标就往回掉，掉得比涨得快（slipPerTick）—— 抖动着蒙混过关是不行的
      this.holdTicks = Math.max(0, this.holdTicks - win.slipPerTick);
    }

    /* ——— 结局 ②：能量枯竭 ——————————————————————————————————————— */
    const S = O.starve;
    if ((this.pools[S.pool] ?? 1) <= S.emptyBelow) {
      this.starveTicks += 1;
      if (this.starveTicks >= S.sustainTicks) {
        return this._finish('lose', 'starvation', { pool: S.pool });
      }
    } else this.starveTicks = Math.max(0, this.starveTicks - 1);

    /* ——— 结局 ③：脱靶与毒性（红区超载）—————————————————————————— */
    const T = O.toxicity;
    if (this._readValue(T) >= T.above) {
      this.dangerTicks += 1;
      if (this.dangerTicks >= T.sustainTicks) {
        return this._finish('lose', 'toxicity', {
          node: T.kind === 'metric'
            ? this._metricName(T.id)
            : (this.node(T.id)?.tpl.name ?? T.id),
          redline: T.above,
        });
      }

    if (this.tickCount >= O.timeout.ticks) {
      return this._finish('lose', 'timeout', {
        seconds: (O.timeout.ticks / TPS).toFixed(0),
        metric: this._metricName(win.metric),
      });
    }
  }

  /** 判断一条"安全前置条件"是否成立。
   *   池：当前量 > 池容 × aboveRatio
   *   分子/指标：当前值 < below
   */
  _checkSafe(c) {
    if (c.kind === 'pool') {
      return (this.pools[c.id] ?? 0) > (this.poolsMax[c.id] ?? 0) * c.aboveRatio;
    }
    return this._readValue(c) < c.below;
  }

   *  引擎只负责把运行时的数值（当前值 / 红线 / 秒数 / 分子名）填进 {占位符}。
   *  这样第二关换个结局文案，不用碰引擎一行代码。 */
  _finish(result, reason, vars = {}) {

  /** 折线图快照。画哪些曲线由关卡的 chart.series 决定 ——
   *  引擎不再写死「要采 cGMP 和 Ca」，第二关想画别的曲线改关卡配置就行。 */
  _snapshot() {
    const row = { t: this.tickCount };
    for (const s of this.level.chart.series) {
      row[s.key] = this._readValue(s);
    }
    this.history.push(row);
    if (this.history.length > TUNING.historyCap) this.history.shift();
  }

  /* ------------------------------------------------- 玩家侧边栏调参接口 */
  /** 只允许修改模板白名单内的参数（PDF 难点二：80% 写死，20% 开放） */

    if (!m) return false;
    if (!m.tpl.editable.includes(key)) return false;
    m.tpl[key] = value;

 *    分子动力学、反应强度                → ④ KINETICS

 * ───────────────────────────────────────────────────────────────────────────

 * ───────────────────────────────────────────────────────────────────────────

 *
 * ───────────────────────────────────────────────────────────────────────────

 * ───────────────────────────────────────────────────────────────────────────

 */

/* ------------------------------------------------------------ 路径工具 */
function edgePoint(node, tx, ty, pad = 8) {
  const dx = tx - node.x, dy = ty - node.y;
  if (dx === 0 && dy === 0) return { x: node.x, y: node.y };
  const hw = NODE_W / 2 + pad, hh = NODE_H / 2 + pad;
  const sx = dx === 0 ? Infinity : hw / Math.abs(dx);
  const sy = dy === 0 ? Infinity : hh / Math.abs(dy);
  const s = Math.min(sx, sy);
  return { x: node.x + dx * s, y: node.y + dy * s };

    pts[n - 1] = edgePoint(to, pts[n - 2].x, pts[n - 2].y);

      if (m.isDrug && m.count < 1) continue; // 未投放的药物不可点

   * 把"分数个粒子"攒起来，攒够一个就发一个；防止帧间隔抖动让粒子忽多忽少。
   *
   *   produce 反应  —— 按 sim.lastGain（刚生成的分子数）× 1.1 吐，颜色用 cGMP 绿
   *   consume 反应  —— 按被降解的量 × 1.4 吐，颜色用 PDE5 红（飞向酶）
   *   activate 反应 —— 流速 = 上游推动力 × 26；命中瞬间额外 +10（闪爆发）

  _emit(dt) {

      if (!src) continue;

      if (rx.effect === 'produce') {

      } else if (rx.effect === 'consume') {

   * 顺序很重要 —— 后画的盖在先画的上方。所以节点必须最后画，否则粒子会盖掉节点标签。
   *

      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-9, -4.5); ctx.lineTo(-9, 4.5); ctx.closePath();
      ctx.fillStyle = active ? 'rgba(120,220,210,0.75)' : 'rgba(150,170,190,0.3)';
      ctx.fill();
    }
    ctx.restore();

      ctx.save();
      ctx.font = '10px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = active ? 'rgba(190,220,235,0.6)' : 'rgba(150,170,190,0.28)';

  _drawParticles(ctx) {
    ctx.save();

      if (!pts) continue;
      const pos = pointAt(pts, p.t);
      const fade = p.t > 0.85 ? (1.05 - p.t) / 0.2 : 1;
      ctx.globalAlpha = Math.max(0, Math.min(1, fade)) * 0.9;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  _drawNode(ctx, def) {
    const m = this.sim.node(def.id);
    if (!m) return;
    if (m.isDrug && m.count < 1) return; // 未投放不画

    const sat = m.saturation;
    const muted = m.isMuted;
    const selected = this.sim.selected === def.id;
    const base = def.color || '#4dd0c7';

    // 命中闪光
    const flash = m.flash;
    const alpha = muted ? 0.3 : 0.14 + sat * 0.72;

    ctx.save();

      ctx.shadowColor = base;
      ctx.shadowBlur = 10 + sat * 26 + flash * 14;
    }
    ctx.fillStyle = this._alpha(base, alpha);

    ctx.lineWidth = selected ? 2.4 : 1.5;
    roundRect(ctx, def.x - NODE_W / 2, def.y - NODE_H / 2, NODE_W, NODE_H, 12);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();
    ctx.restore();

    // 文本
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = muted ? 'rgba(230,240,250,0.4)' : '#eaf4ff';
    ctx.font = '600 15px ui-sans-serif, system-ui';
    ctx.fillText(def.name, def.x, def.y - 10);
    ctx.font = '10px ui-monospace, monospace';
    ctx.fillStyle = muted ? 'rgba(230,240,250,0.3)' : 'rgba(220,235,250,0.55)';
    ctx.fillText(this._countText(m, def), def.x, def.y + 6);

    // 激活度条
    const bw = NODE_W - 26;
    const bx = def.x - bw / 2, by = def.y + 15;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(ctx, bx, by, bw, 4, 2); ctx.fill();
    ctx.fillStyle = muted ? '#6b7480' : base;
    roundRect(ctx, bx, by, bw * (muted ? 0 : sat), 4, 2); ctx.fill();

    // 状态徽标

      ctx.fillStyle = '#ff7a6b';
      ctx.font = '600 9px ui-sans-serif, system-ui';
      ctx.fillText('MUTED', def.x, def.y + 30);
    } else if (m.status === Status.ACTIVE) {
      ctx.fillStyle = this._alpha(base, 0.95);

      ctx.fillText('ACTIVE', def.x, def.y + 30);
    }
    // 命中闪光环

      ctx.globalAlpha = flash * 0.55;
      ctx.strokeStyle = base;
      ctx.lineWidth = 2;
      roundRect(ctx, def.x - NODE_W / 2 - 5, def.y - NODE_H / 2 - 5, NODE_W + 10, NODE_H + 10, 15);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  _countText(m, def) {
    if (def.drive === 'count' || def.drive === 'pulse') {
      return m.count < 10 ? m.count.toFixed(1) : Math.round(m.count).toString();
    }
    return Math.round(m.activation) + '%';
  }

  _alpha(hex, a) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
}

/* --------------------------------------------------------- 折线图渲染 */
  /** 画右下角那张 Ca/cGMP 时间曲线。逻辑很简单：
   *   · 拿 sim.history（每 2 个 tick 推一条的快照）
   *   · 把每个值用 `yOf` 函数映射到画布像素

   */
class Chart {
  constructor(canvas, level, sim) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.level = level;
    this.sim = sim;
    this.resize();
  }

  resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const w = Math.max(320, rect.width || 340);
    const h = Math.max(100, rect.height || 124);
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = w * dpr;
    this.canvas.height = h * dpr;
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = w; this.h = h;
  }

  autoResize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    if (Math.abs((rect.width || 0) - this.w) > 1 || Math.abs((rect.height || 0) - this.h) > 1) {
      this.resize();
      return true;
    }
    return false;
  }

  draw() {
    const ctx = this.ctx, w = this.w, h = this.h;

    const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    ctx.clearRect(0, 0, w, h);

    const hist = this.sim.history;
    const goal = this.level.goal.target;
    // 纵轴量程与要画哪几条曲线，全部由关卡的 chart 配置决定 ——
    // 这里不再写死「画 Ca 和 cGMP」。改关卡的 CHART 即可，本文件不用动。
    const yMax = this.level.chart.max;
    const series = this.level.chart.series;

    // 安全区间带（核心指标 ≤ target 为安全）
    const yOf = (v) => pad.t + ih - (Math.max(0, Math.min(yMax, v)) / yMax) * ih;
    ctx.fillStyle = 'rgba(126,224,138,0.09)';
    ctx.fillRect(pad.l, yOf(goal), iw, pad.t + ih - yOf(goal));
    ctx.strokeStyle = 'rgba(126,224,138,0.45)';
    ctx.setLineDash([4, 4]);

    ctx.setLineDash([]);

    // 刻度：按量程均分四段（量程 160 → 0 / 40 / 80 / 120 / 160）
    const TICKS = 4;
    ctx.fillStyle = 'rgba(139,152,165,0.75)';
    ctx.font = '9px ui-monospace, monospace';
    ctx.textAlign = 'right';
    for (let i = 0; i <= TICKS; i++) {
      const v = (yMax / TICKS) * i;
      const y = yOf(v);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + iw, y); ctx.stroke();
      ctx.fillText(String(v), pad.l - 6, y + 3);
    }

    if (hist.length < 2) return;

    const n = hist.length;
    const xOf = (i) => pad.l + (i / Math.max(1, n - 1)) * iw;

    for (const s of series) {
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const y = yOf(hist[i][s.key]);

      ctx.strokeStyle = s.color;
      ctx.lineWidth = 1.8;
      ctx.stroke();
      // 当前值端点
      const lastY = yOf(hist[n - 1][s.key]);

      ctx.fillStyle = s.color; ctx.fill();
      ctx.textAlign = 'left';
      ctx.fillStyle = s.color;
      ctx.font = '10px ui-monospace, monospace';
      // 端点标注取「当前实时值」，不走 history —— history 是每 2 tick 才存一条的
      const lv = this.sim._readValue(s).toFixed(0);
      ctx.fillText(lv, pad.l + iw + 6, lastY + 3);
    }
    // 图例
    ctx.textAlign = 'left';
    ctx.font = '10px ui-sans-serif, system-ui';
    let lx = pad.l + 4;
    for (const s of series) {
      ctx.fillStyle = s.color;
      ctx.fillRect(lx, pad.t + 2, 8, 2.5);
      ctx.fillText(s.label, lx + 12, pad.t + 6);
      lx += 52;
    }
  }
}
return { Renderer: Renderer, Chart: Chart };

/** 指标 id → 显示名；找不到就用 id 兜底 */
const metricName = (level, id) =>
  level.metrics.find((m) => m.id === id)?.name ?? id;

/** 分子 id → 显示名；找不到就用 id 兜底 */
const nodeName = (level, id) =>
  level.nodes.find((n) => n.id === id)?.name ?? id;

class UI {
  constructor(ctx) {
    this.ctx = ctx; // { sim, level, renderer, chart, reset, togglePause, setSpeed }
    this.el = {
      levelName: $('levelName'), clock: $('clock'), clockTotal: $('clockTotal'),
      btnPause: $('btnPause'), btnSpeed: $('btnSpeed'), btnReset: $('btnReset'), btnHelp: $('btnHelp'),
      dock: $('dock'), caVal: $('caVal'), caFill: $('caFill'), caSafe: $('caSafe'),
      caTarget: $('caTarget'), caGoal: $('caGoal'), caHold: $('caHold'),
      relaxVal: $('relaxVal'), relaxFill: $('relaxFill'),
      cgmpVal: $('cgmpVal'), cgmpFill: $('cgmpFill'),
      gtpVal: $('gtpVal'), gtpFill: $('gtpFill'),
      inspector: $('inspector'), inspectorTitle: $('inspectorTitle'),
      log: $('log'), modal: $('modal'), modalCard: $('modalCard'),
      tooltip: $('tooltip'), phaseTag: $('phaseTag'), tickTag: $('tickTag'),
    };
    this._lastLogLen = -1;
    this._bind();
    this._buildDock();
    this.renderInspector();
    this.renderBrief();
  }

  /* ------------------------------------------------------------ 绑定 */
  /** 把 UI 控件的事件挂上对应的动作。
   * 这里你能看到一个 JS 里的常见模式：监听 canvas 上的 mousemove 事件，
   * 根据鼠标坐标调用 renderer.hitTest() 找到下面的节点，再把节点的"档案卡"显示出来。
   */
  _bind() {
    const { level, renderer } = this.ctx;
    const canvas = renderer.canvas;

    this.el.levelName.textContent =
      `${level.name} · ${level.subtitle}`;
    this.el.clockTotal.textContent = `/ ${(level.timeout / TPS).toFixed(0)}s`;
    this.el.caGoal.textContent = level.goal.target;
    this.el.caSafe.style.width = `${(level.goal.target / level.chart.max) * 100}%`;
    this.el.caTarget.style.left = `${(level.goal.target / level.chart.max) * 100}%`;

    this.el.btnPause.onclick = () => this.ctx.togglePause();
    this.el.btnSpeed.onclick = () => this.ctx.cycleSpeed();
    this.el.btnReset.onclick = () => this.ctx.reset();
    this.el.btnHelp.onclick = () => this.renderBrief($('briefModal'));

    canvas.addEventListener('click', (e) => {
      const id = renderer.hitTest(e.clientX, e.clientY);
      this.ctx.sim.selected = id;
      this.renderInspector();
    });

    canvas.addEventListener('mousemove', (e) => {
      const id = renderer.hitTest(e.clientX, e.clientY);
      if (!id) { this.el.tooltip.classList.remove('show'); return; }
      const def = level.nodes.find((n) => n.id === id);
      const m = this.ctx.sim.node(id);
      const rect = canvas.getBoundingClientRect();
      this.el.tooltip.innerHTML =
        `<b>${def.name}</b> <span style="color:#8b98a5">${def.cn}</span>` +
        `<div class="tt-desc">${def.desc}</div>` +
        `<div class="tt-tags">${def.tags.map((t) => `<span class="tag">${t}</span>`).join('')}</div>`;
      this.el.tooltip.classList.add('show');
      const tx = e.clientX - rect.left + 16, ty = e.clientY - rect.top + 14;
      this.el.tooltip.style.left = Math.min(tx, rect.width - 290) + 'px';
      this.el.tooltip.style.top = ty + 'px';
    });
    canvas.addEventListener('mouseleave', () => this.el.tooltip.classList.remove('show'));

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      const k = e.key.toLowerCase();
      if (k === ' ') { e.preventDefault(); this.ctx.togglePause(); }
      else if (k === 'r') this.ctx.reset();
      else if (k === 'escape') { $('briefModal').style.display = 'none'; }
      else {
        const d = level.drugs.find((x) => x.hotkey === e.key);
        if (d) { this.ctx.applyDrug(d.id); this._buildDock(); }
      }
    });

    $('briefModal').addEventListener('click', (e) => {
      if (e.target.id === 'briefModal') $('briefModal').style.display = 'none';
    });
    document.querySelectorAll('.modal .btn-close').forEach((b) => {
      b.onclick = () => { $('briefModal').style.display = 'none'; };
    });

    window.addEventListener('resize', () => {
      this.ctx.renderer.resize();
      this.ctx.chart.resize();
    });
  }

  /* ---------------------------------------------------------- 道具栏 */
  /** 根据 level.drugs 数组渲染右侧的药物按钮。
   * 每次投放后都重新调一次（用完的就 disabled），保持与 sim.drugState 一致。
   * 注意：道具按钮的 HTML 是字符串拼接生成的，不是用 createElement —— 因为没有交互逻辑，
   * 用 innerHTML + querySelectorAll 一遍遍历更短。
   */
  _buildDock() {
    const { level, sim } = this.ctx;
    this.el.dock.innerHTML = level.drugs.map((d) => {
      const st = sim.drugState.get(d.id);
      const left = d.charges - st.uses;
      return `<button class="drug" data-drug="${d.id}" ${left <= 0 ? 'disabled' : ''}>
        <div class="dicon" style="background:${d.color}1f;color:${d.color}">${ICONS[d.icon] || ICONS.pill}</div>
        <div style="min-width:0">
          <div class="dname">${d.name}</div>
          <div class="den">${d.en}</div>
          <div class="ddesc">${d.desc}</div>
        </div>
        <span class="dkey">${d.hotkey}</span>
        <span class="dcount">${left}/${d.charges}</span>
      </button>`;
    }).join('');

    this.el.dock.querySelectorAll('.drug').forEach((b) => {
      b.onclick = () => {
        this.ctx.applyDrug(b.dataset.drug);

      };

  /* -------------------------------------------------------- 每帧刷新 */
  /** ~20 Hz 由主循环调一次。把所有"会变的"仪表盘数字、进度条、相位标签刷一遍。
   * 关键优化：日志列表只在长度变化时才重写（_lastLogLen 缓存），
   * 否则即便没有新事件也走一遍字符串拼接挺浪费。
   */
  update() {
    const { sim, level } = this.ctx;
    const Ca = sim.metrics.Ca;
    const goal = level.goal.target;
    // 仪表量程与折线图量程共用同一份配置（level.chart.max），改一处两边同步
    const caMax = level.chart.max;
    const cgmp = sim.node(level.outcome.toxicity.id)?.count ?? 0;

    this.el.clock.textContent = sim.time.toFixed(1) + 's';
    this.el.caVal.textContent = Ca.toFixed(0);
    const good = Ca <= goal;
    this.el.caVal.className = 'gauge-val' + (good ? ' good' : '');
    this.el.caFill.style.width = `${Math.min(100, (Ca / caMax) * 100)}%`;
    this.el.caFill.className = 'gauge-fill' + (good ? ' good' : '');

    const hold = (sim.holdTicks / TPS).toFixed(1);
    this.el.caHold.textContent = `已稳定 ${hold}s / ${(level.goal.hold / TPS).toFixed(1)}s`;

    const relax = Math.max(0, Math.min(100, 100 - Ca));
    this.el.relaxVal.textContent = relax.toFixed(0) + '%';
    this.el.relaxFill.style.width = relax + '%';

    this.el.cgmpVal.textContent = cgmp.toFixed(0);
    this.el.cgmpFill.style.width = `${Math.min(100, (cgmp / (level.redline.cGMP || 320)) * 100)}%`;

    const gtp = sim.pools.GTP ?? 0;
    const gtpMax = sim.poolsMax.GTP || 1;
    this.el.gtpVal.textContent = gtp.toFixed(0);
    this.el.gtpFill.style.width = `${(gtp / gtpMax) * 100}%`;

    // 相位标签
    let tag = '推演中', cls = 'panel-tag';
    if (sim.outcome) {
      tag = sim.outcome.result === 'win'
        ? level.outcomeText.homeostasis.title : '系统崩溃';
      cls += sim.outcome.result === 'win' ? ' good' : ' warn';
    }
    else if (sim.paused) { tag = '已暂停'; }
    else if (cgmp >= (level.redline.cGMP || 320) * 0.8) { tag = 'cGMP 逼近红线'; cls += ' warn'; }
    else if (gtp < gtpMax * 0.15) { tag = '能量告急'; cls += ' warn'; }
    else if (good) { tag = '进入安全区'; cls += ' good'; }
    this.el.phaseTag.textContent = tag;
    this.el.phaseTag.className = cls;
    this.el.tickTag.textContent = sim.speed === 1 ? '10 Hz' : `${10 * sim.speed} Hz`;

    this._renderLog();
    if (this.ctx.sim.selected) this._updateInspectorValues();
  }

  _renderLog() {
    const ev = this.ctx.sim.events;
    if (ev.length === this._lastLogLen) return;
    this._lastLogLen = ev.length;
    this.el.log.innerHTML = ev.slice(0, 30).map((e) =>
      `<div class="log-item k-${e.kind}"><span class="lt">${e.t}s</span><span>${e.text}</span></div>`
    ).join('') || '<div class="log-item"><span style="color:#5c6b7a">等待事件…</span></div>';
  }

  /* ---------------------------------------------------------- 检查器 */
  /** 渲染点中节点后的右侧详情面板。这里会做两件事：
   *   1. 节点档案（desc + 标签徽标 + 当前数值）
   *   2. 列出该节点 `editable` 白名单里的参数，每个参数生成一个 range 滑块
   *
   * 滑块 oninput 时直接调 sim.setParam(id, key, value) —— 见 engine.js 末尾的速查表。
   */
  renderInspector() {
    const { sim, level } = this.ctx;
    const id = sim.selected;
    const def = id ? level.nodes.find((n) => n.id === id) : null;

    if (!def) {
      this.el.inspectorTitle.textContent = '关卡简报';
      this.el.inspector.innerHTML =
        `<div class="hint-box">${level.hint}</div>` +
        `<div class="insp-desc">${level.brief}</div>` +
        level.lessons.map((l) => `<div class="lesson">${l}</div>`).join('') +
        `<div class="insp-desc" style="margin-top:12px;font-size:11px;color:#5c6b7a">
          点击通路图中任意节点，可查看档案并调节它的关键参数。
        </div>`;
      return;
    }

    const m = sim.node(id);
    this.el.inspectorTitle.textContent = `${def.name} · ${def.cn}`;
    const tags = def.tags.map((t) => `<span class="tag" style="font-family:var(--mono);font-size:9.5px;padding:1.5px 5px;border-radius:4px;background:rgba(77,208,199,.12);color:#4dd0c7;border:1px solid rgba(77,208,199,.25)">${t}</span>`).join('');

    const isCount = def.drive === 'count' || def.drive === 'pulse';
    this.el.inspector.innerHTML =
      `<div class="insp-desc">${def.desc}</div>
       <div class="insp-tags">${tags}</div>
       <div class="insp-stats">
         <div class="insp-stat"><div class="k">${isCount ? 'MOLECULES' : 'ACTIVATION'}</div><div class="v" data-f="main">—</div></div>
         <div class="insp-stat"><div class="k">STATUS</div><div class="v" data-f="status" style="font-size:12px">—</div></div>
         <div class="insp-stat"><div class="k">DRIVE (推动力)</div><div class="v" data-f="drive">—</div></div>
         <div class="insp-stat"><div class="k">BUFF 剩余</div><div class="v" data-f="timer">—</div></div>
       </div>
       <div id="params"></div>
       <div class="insp-desc" style="font-size:10.5px;color:#5c6b7a;line-height:1.7">
         白色描边表示当前选中。只有列入白名单的参数可调 —— 其余 80% 的分子参数由引擎写死，
         以保证网络能稳定涌现出负反馈与稳态。
       </div>`;

    const box = $('params');
    for (const key of (def.editable || [])) {
      const meta = PARAM_META[key];
      if (!meta) continue;
      const raw = m.tpl[key];
      const val = Array.isArray(raw) ? raw[1] : raw;
      const wrap = document.createElement('div');
      wrap.className = 'param';
      wrap.innerHTML =
        `<div class="param-row"><span class="pk">${meta.label}</span><span class="pv" data-v="${key}">${val}</span></div>
         <input type="range" min="${meta.min}" max="${meta.max}" step="${meta.step}" value="${val}" data-k="${key}">
         <div class="param-note">${meta.note}</div>`;
      const input = wrap.querySelector('input');
      const out = wrap.querySelector('.pv');
      input.oninput = () => {
        const v = parseFloat(input.value);
        out.textContent = v;
        sim.setParam(id, key, Array.isArray(raw) ? [0, v] : v);
      };
      box.appendChild(wrap);
    }
    this._updateInspectorValues();
  }

  _updateInspectorValues() {
    const { sim, level } = this.ctx;
    const id = sim.selected;
    if (!id) return;
    const m = sim.node(id);
    const def = level.nodes.find((n) => n.id === id);
    if (!m || !def) return;
    const isCount = def.drive === 'count' || def.drive === 'pulse';
    const set = (f, v) => { const e = this.el.inspector.querySelector(`[data-f="${f}"]`); if (e) e.textContent = v; };
    set('main', isCount ? (m.count < 10 ? m.count.toFixed(1) : Math.round(m.count)) : Math.round(m.activation) + '%');
    set('status', m.isMuted ? 'Muted' : m.status);
    set('drive', m.drive.toFixed(2));
    // 原式 Math.round(m.timer / 10 * 10) 等于 Math.round(m.timer) —— 就是剩余帧数
    set('timer', Math.round(m.timer) + 'f');
  }

  /* ---------------------------------------------------------- 结算窗 */
  /** 模拟结束（sim.outcome != null）时被调。把结果摘要填进弹窗。
   * 注意：时间、Ca 终值、峰值 cGMP 都从 sim 直接读取，是"赛后快照"。
   * "再看说明"按钮复用 briefModal 模态框 —— 同一份 HTML 容器塞两种内容。
   */
  showOutcome() {
    const { sim, level } = this.ctx;
    const o = sim.outcome;
    if (!o) return;
    const win = o.result === 'win';
    const node = (id) => sim.node(id);
    this.el.modalCard.innerHTML =
      `<h2>${win ? '稳态恢复' : o.title}
         <span class="badge ${win ? 'win' : 'lose'}">${win ? 'SUCCESS' : 'FAILED'}</span></h2>
       <p class="m-desc">${o.detail}</p>
       <div class="m-stats">
         <div class="m-stat"><div class="k">用时</div><div class="v">${o.time.toFixed(1)}s</div></div>
         <div class="m-stat"><div class="k">终值 Ca²⁺</div><div class="v" style="color:${win ? '#7ee08a' : '#ff7a6b'}">${sim.metrics.Ca.toFixed(0)}</div></div>
         <div class="m-stat"><div class="k">峰值 cGMP</div><div class="v">${Math.max(...sim.history.map((h) => h.cGMP), 0).toFixed(0)}</div></div>
       </div>
       <div class="m-desc" style="font-size:11.5px;color:#6f7f8e">
         终局快照 · cGMP ${(node('cGMP')?.count ?? 0).toFixed(0)} ·
         PKG ${(node('PKG')?.activation ?? 0).toFixed(0)}% ·
         PDE5 ${(node('PDE5')?.activation ?? 0).toFixed(0)}% ·
         GTP 余 ${(sim.pools.GTP ?? 0).toFixed(0)}
       </div>
       <div class="m-actions">
         <button class="btn" onclick="document.getElementById('briefModal').style.display='grid'">再看说明</button>
         <button class="btn primary" id="againBtn">重新推演</button>
       </div>`;
    this.el.modal.hidden = false;
    $('againBtn').onclick = () => { this.el.modal.hidden = true; this.ctx.reset(); };
  }

  hideOutcome() { this.el.modal.hidden = true; }

  /* ---------------------------------------------------------- 说明窗 */
  renderBrief(modal) {
    const { level } = this.ctx;
    const target = modal || $('briefModal');
    $('briefCard').innerHTML =
      `<h2>${level.name}<span class="badge win" style="margin-left:8px">${level.subtitle}</span></h2>
       <p>${level.brief}</p>
       <p style="color:#8b98a5;font-size:12px">${level.hint}</p>
       <p style="margin-top:14px"><b style="color:#4dd0c7">怎么玩</b></p>
       <ul>
         <li>点通路图上的<b>节点</b>可查看档案，并拖动滑块调节它的关键参数</li>
         <li>点<b>道具栏</b>或按 <span class="kbd">1</span>–<span class="kbd">4</span> 投放药物</li>
         <li><span class="kbd">空格</span> 暂停 / 继续 &nbsp; <span class="kbd">R</span> 重置 &nbsp; 右上角可切换 1× / 2× / 4× 推演速度</li>
       </ul>
      <p style="margin-top:14px"><b style="color:#b39dff">结算规则</b></p>
      <ul>
        ${briefRules(level)}
      </ul>
       <div class="m-actions" style="margin-top:20px">
         <button class="btn primary btn-close">开始推演</button>
       </div>`;
    target.style.display = 'grid';
    const btn = document.querySelector('#briefCard .btn-close');
    if (btn) btn.onclick = () => { target.style.display = 'none'; };
  }

  refreshSpeed(speed) { this.el.btnSpeed.textContent = speed + '×'; }
  refreshPause(paused) {
    this.el.btnPause.textContent = paused ? '继续' : '暂停';
    this.el.btnPause.classList.toggle('on', paused);
  }
}
return { PARAM_META: PARAM_META, UI: UI };
})();

 *
 *   · 顶部：导入 Simulator（逻辑）、Renderer + Chart（画图）、UI（仪表盘），

/* import from ./pathways/nocgmp.js */
/* import from ./render.js */
/* import from ./ui.js */

const sim = new Simulator(level, { seed: (Date.now() % 100000) + 7 });

// 参数：
//   canvas —— 画布元素，用于绘制粒子和节点
//   level  —— 关卡实例，包含所有逻辑和数据

const renderer = new Renderer(document.getElementById('pathway'), level, sim);

//   canvas —— 画布元素，用于绘制折线图

const chart = new Chart(document.getElementById('chart'), level, sim);

 * 这里的 frame(now) 角色相同，只是"喊它的人"从 Cocos 引擎换成了浏览器 ——

 *
 * 唯一区别：cocos 的 update 每帧直接跑逻辑；而这个模拟器的逻辑是
 * "固定步长，100ms 跳一步"（TICK_MS），不能每帧都跳 —— 否则换台刷新率
 * 不同的设备，模拟跑的速度就不一样了。所以要用累加器把真实流逝的时间
 * 攒起来，攒满 100ms 才跑一次 sim.tick()。渲染则仍按每帧走，画面才顺滑。
 */

/** 累加器用到的四个变量：
 *   last   —— 上一次 frame() 的时刻（毫秒，performance.now() 提供）
 *   acc    —— 自上次 sim.tick() 以来积攒的"逻辑时间"（毫秒）
 *   uiAcc  —— 自上次 ui.update() 以来积攒的"UI 刷新时间"（秒，~20Hz）
 *   frames —— 帧计数，每 30 帧触发一次自动 resize
 */
let last = performance.now();
let acc = 0;
let uiAcc = 0;
let frames = 0;

function frame(now) { 
  // 夹住时间步长：标签页切回来时的巨大间隔、或异常时间戳都不该打乱推演
  // raw 是「真实帧间隔」（秒），限制在 0.25s 内（避免帧率过快）
  const raw = Math.max(0, Math.min(0.25, (now - last) / 1000));
  last = now; // now 是当前时间戳（毫秒，performance.now() 提供）

  if (!sim.paused && !sim.outcome) {
    // 累加器循环：把「真实流逝的毫秒 × 倍速」攒进 acc，每攒满 100ms 就跑一步 tick ——
    // 就像每帧往存钱罐丢硬币，丢满 100 分才花一次；倍速只是让丢钱更快。
    // guard < 12 防止一帧内跑出几百步把浏览器卡死。
    acc += raw * 1000 * sim.speed;
    let guard = 0;
    while (acc >= TICK_MS && guard < 12) {
      sim.tick();
      acc -= TICK_MS;
      guard += 1;
      if (sim.outcome) break;
    }
    if (sim.outcome) {
      ui.showOutcome();
    }
  }

  // 低频自适应：容器尺寸变化（窗口缩放 / 首帧布局未就绪）时重建画布
  if (++frames % 30 === 0) {
    renderer.autoResize();
    chart.autoResize();
  }

  // 注意 raw 用的是「实际帧间隔」而不是 sim.tick 的固定 100ms：
  // 粒子位置要按真实经过的时间插值，看起来才"顺"而不是"跳"
  renderer.draw(raw * (sim.paused ? 0 : sim.speed));
  chart.draw();

  // DOM 仪表盘降到 ~20 Hz 刷新，避免每帧写 DOM
  uiAcc += raw;
  if (uiAcc >= 0.05) { ui.update(); uiAcc = 0; }

  requestAnimationFrame(frame); // 递归调用，实现帧率控制
}
requestAnimationFrame(frame); // 启动主循环

/* ---------------- 调试出口 ---------------- */
/* 打包后每个模块都被包进 IIFE（见 tools/build.js），各文件的顶层 const 不再
 * 暴露到全局 —— 好处是彻底消除命名冲突，代价是浏览器控制台访问不到内部对象了。
 * 这里显式挂一份到 window，把调试能力补回来：
 *   __sim.sim.metrics.Ca           当前钙离子浓度
 *   __sim.sim.node('cGMP')         任意分子的实时状态
 *   __sim.actions.applyDrug('ntg') 手动投放药物做实验
 * 仅在浏览器环境生效；Node 下的配平脚本（tools/*.mjs）走的是 ESM，不会经过这里。 */
if (typeof window !== 'undefined') {
  window.__sim = { sim, level, renderer, chart, actions };
}
return {};
})();

})();
</script>
